{# Pop-up (modal) de edición de una solicitud del público.
   htmx inyecta este <dialog> dentro del contenedor #modal.
   Al guardar, la tarjeta (id sol-<id>) se actualiza y el pop-up se cierra
   con cerrarEdicion() (definida en index.html). #}
<dialog open>
    <h3>Editar solicitud</h3>

    <form hx-post="/solicitudes/{{ solicitud.id }}/actualizar"
          hx-target="#sol-{{ solicitud.id }}"
          hx-swap="outerHTML"
          hx-on::after-request="cerrarEdicion()">

        <label>Título *
            <input type="text" name="titulo" value="{{ solicitud.titulo }}" required>
        </label>

        <label>
            Fecha y hora
            <input type="text" name="fecha_hora"
                   value="{{ solicitud.fecha_hora.strftime('%Y-%m-%d %H:%M') if solicitud.fecha_hora else '' }}">
            <span class="pista">Formato: AAAA-MM-DD HH:MM</span>
        </label>

        <label>Lugar
            <input type="text" name="lugar" value="{{ solicitud.lugar or '' }}">
        </label>

        <label>Categoría
            <input type="text" name="categoria" value="{{ solicitud.categoria or '' }}">
        </label>

        <label>Precio
            <input type="text" name="precio" value="{{ solicitud.precio or '' }}">
        </label>

        <label>Contacto
            <input type="text" name="contacto" value="{{ solicitud.contacto or '' }}">
        </label>

        <label class="campo-largo">Link a la fuente
            <input type="text" name="link_fuente" value="{{ solicitud.link_fuente or '' }}">
        </label>

        <label class="campo-largo">Descripción
            <textarea name="descripcion" rows="3">{{ solicitud.descripcion or '' }}</textarea>
        </label>

        <div class="acciones">
            <button type="submit" class="btn-accion aceptar">Guardar</button>
            <button type="button" class="btn-accion peligro" onclick="cerrarEdicion()">Cancelar</button>
        </div>
    </form>
</dialog>
